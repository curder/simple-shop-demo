import:
  - recipe/laravel.php
  - contrib/php-fpm.php
  - contrib/yarn.php
  - contrib/rsync.php

config:
  application: webfsd.com
  git_ssh_command: ssh
  repository: git@github.com:curder/simple-shop-demo.git
  update_code_strategy: clone
  keep_releases: 5
  default_timeout: 3600
  remote_user: deployer
  http_user: nginx
  'bin/php': /usr/bin/php83
  'bin/git': /usr/bin/git
  'bin/yarn': /usr/bin/node18 /home/deployer/.nvm/versions/node/v16.13.0/bin/yarn
  'bin/composer': '{{bin/php}} /usr/local/bin/composer'
  identity_file: ~/.ssh/id_rsa
  php_fpm_version: 83
  php_fpm_service: 'php{{php_fpm_version}}-php-fpm'
  shared_dirs:
    - storage
  shared_files:
    - .env
  # Rsync config
  rsync_src: .
  rsync_dest: '{{release_path}}'
  rsync:
    exclude:
      - '/.idea/'
      - '.env*'
      - '.phpunit.result.cache'
      - 'deploy.yaml'
      - '/vendor/'
      - '/node_modules/'
    include: [ ]
    include-file: false
    exclude-file: false
    filter: [ ]
    filter-file: false
    filter-perdir: false
    flags: rz
    options: [ 'delete' ]
    timeout: 3600

hosts:
  ssd.webfsd.com:
    hostname: 8.223.35.130
    branch: develop
    deploy_path: '/var/www/codes/webfsd.com/ssd.webfsd.com'

tasks:
  #  deploy:
  #    - deploy:prepare
  #    - deploy:vendors
  #    - artisan:storage:link
  #    - artisan:view:cache
  #    - artisan:config:cache
  #    - artisan:optimize
  #    - artisan:filament:optimize
  #    - artisan:migrate
  #    - yarn:install
  #    - yarn:run:prod
  #    - deploy:publish
  ##    - php-fpm:reload
  deploy:rsync:
    - deploy:release
    - rsync
    - deploy:shared
    - deploy:vendors
    - deploy:writable
    - artisan:storage:link
    - artisan:view:cache
    - artisan:config:cache
    - artisan:optimize
    - artisan:filament:optimize
    - artisan:migrate
    - deploy:publish
  #    - php-fpm:reload
  yarn:run:prod:
    - desc: 'Compile assets'
    - cd: '{{release_path}}'
    - run: '{{bin/yarn}} build'
  php-fpm:reload:
    - desc: 'Reload PHP'
    - run: 'sudo /sbin/service {{php_fpm_service}} reload'
  artisan:filament:optimize:
    - desc: 'Optimize Filament'
    - cd: "{{release_path}}"
    - run: '{{bin/php}} artisan filament:optimize'

after:
  deploy:failed: deploy:unlock
